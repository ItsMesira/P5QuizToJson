# Daily keep-alive ping.
# Supabase free-tier projects pause after ~7 days without database activity,
# and GitHub disables scheduled workflows after 60 days of repo inactivity.
# This workflow solves both: it runs daily, hits /api/health (which runs a
# real SELECT 1 through the pool), and re-schedules itself so it never lapses.
name: keep-alive

on:
  schedule:
    - cron: "0 12 * * *" # every day at 12:00 UTC
  workflow_dispatch: # manual trigger button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app (keeps Supabase warm)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$VERCEL_URL/api/health" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          echo "::warning::health ping failed after 5 attempts"
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}

      - name: Re-schedule itself (defeats GitHub's 60-day inactivity pause)
        if: always() && github.event_name == 'schedule'
        run: |
          gh workflow run keep-alive.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
