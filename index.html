<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="A Persona 5 styled quiz heist. Load any quiz.json and steal the answers." />
    <title>P5 QUIZ — Steal the Answers</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 L60 60 H4 Z' fill='%23E60012'/%3E%3Cpath d='M32 14 L52 58 H12 Z' fill='%230C0C0E'/%3E%3Ccircle cx='32' cy='40' r='7' fill='%23F6F4F0'/%3E%3C/svg%3E" />
    <!-- ============ BOOT SHELL ============
         First boot is the only wait a JS loader cannot cover: a React (or any)
         script cannot paint before it has downloaded, which is precisely the
         window being covered. This shell is inlined so it paints on the first
         byte, with zero JS and no stylesheet round-trip.

         Colours are literal hex because tokens.css has not loaded yet; each is
         annotated with the token it mirrors. Type is a SYSTEM stack because the
         webfonts (Archivo Black et al) are not available at this point either.

         The ground paints immediately; the CARD fades in from 300ms. So a fast
         boot shows only the app's own dark ground and never flashes a splash,
         while a slow boot gets the full treatment. src/main.ts fades the whole
         shell out before the first route so the handoff is a crossfade. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 55; /* under the veil (60) — the router's first clear() removes this */
        display: grid;
        place-items: center;
        background-color: #0c0c0e; /* --ink */
        background-image: radial-gradient(rgba(246, 244, 240, 0.07) 1px, transparent 1px),
          linear-gradient(104deg, transparent 0 62%, rgba(230, 0, 18, 0.16) 62% 71%, transparent 71%);
        background-size: 18px 18px, 100% 100%;
        transition: opacity 180ms ease-out;
      }
      #boot.boot-out {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-card {
        display: flex;
        width: 256px;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        border: 3px solid #000;
        background: #f6f4f0; /* --paper */
        padding: 22px 20px;
        box-shadow: 8px 8px 0 0 rgba(0, 0, 0, 0.85); /* --shadow-cut, harder */
        transform: rotate(-1.5deg);
        opacity: 0;
        animation: boot-in 260ms cubic-bezier(0.34, 1.56, 0.64, 1) 300ms forwards;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: translateY(10px) rotate(-1.5deg);
        }
        to {
          opacity: 1;
          transform: translateY(0) rotate(-1.5deg);
        }
      }
      #boot .boot-mark {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 2px solid #0c0c0e;
        border-radius: 50%;
        background: #fff;
      }
      #boot .boot-mark::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e60012; /* --red */
      }
      #boot .boot-kicker {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        font-size: 21px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.01em;
        text-align: center;
        text-transform: uppercase;
        color: #0c0c0e;
      }
      #boot .boot-bar {
        width: 100%;
        height: 14px;
        border: 2px solid #0c0c0e;
        background: #fff;
        padding: 2px;
      }
      #boot .boot-bar > i {
        display: block;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #a3000d, #e60012 45%, #ffd76a);
        animation: boot-fill 1.1s ease-in-out infinite;
      }
      @keyframes boot-fill {
        0% {
          transform: scaleX(0.06);
        }
        60% {
          transform: scaleX(0.86);
        }
        100% {
          transform: scaleX(0.06);
        }
      }
      #boot .boot-dots {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.3em;
        color: #8a8a93; /* --smoke */
        animation: boot-blink 0.9s steps(1, end) infinite;
      }
      @keyframes boot-blink {
        0%,
        60% {
          opacity: 1;
        }
        61%,
        100% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-card {
          opacity: 1;
          animation: none;
        }
        #boot .boot-bar > i {
          animation: none;
          transform: scaleX(0.6);
        }
        #boot .boot-dots {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mark" aria-hidden="true"></div>
          <div class="boot-kicker">Taking Your Heart</div>
          <div class="boot-bar" aria-hidden="true"><i></i></div>
          <div class="boot-dots" aria-hidden="true">&#9670; &#9670; &#9670; &#9670; &#9670;</div>
        </div>
      </div>
    </div>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
    <div id="ambient" aria-hidden="true"></div>
    <div id="veil" aria-hidden="true"></div>
    <div id="toasts" aria-live="polite"></div>
    <button id="class-badge" class="hidden" aria-label="Open classroom">
      <span class="cb-role">🎓</span>
      <span class="cb-name">CLASS</span>
      <span class="cb-code">CODE</span>
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
